<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="水の音を、暗い画面で。ループ再生と時間指定のフェードアウト。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="夜の音">
  <title>夜の音</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" type="module"></script>
</head>
<body>
  <main class="player" aria-label="水の音プレーヤー">
    <header>
      <span class="wordmark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 15.5A8 8 0 0 1 8.5 5 8 8 0 1 0 19 15.5Z"/></svg>夜の音</span>
      <button id="help-open" class="icon-button" aria-label="使い方"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M9.8 9.4a2.3 2.3 0 1 1 3.6 1.9c-1.1.6-1.4 1-1.4 2.2M12 16.8v.1"/></svg></button>
    </header>

    <section class="listen" aria-label="再生">
      <button id="play" class="play-button" aria-label="再生" aria-pressed="false">
        <svg id="play-icon" class="play-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="m12 8 13 8-13 8Z"/></svg>
        <svg id="pause-icon" viewBox="0 0 32 32" aria-hidden="true" hidden><path d="M11 9v14M21 9v14"/></svg>
      </button>
      <p id="status" class="status" role="status" aria-live="polite">水の音</p>
      <p id="remaining" class="remaining" aria-live="off">ループ</p>
    </section>

    <section class="controls" aria-label="音量とフェード">
      <div class="volume-row">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5 5 9H2v6h3l5 4ZM15 9a5 5 0 0 1 0 6M18 6a9 9 0 0 1 0 12"/></svg>
        <input id="volume" aria-label="音量" type="range" min="0" max="1" step="0.01" value="0.5">
      </div>
      <form id="fade-form" class="fade-row">
        <label class="duration"><input id="minutes" aria-label="フェードアウトにかける時間（分）" type="number" inputmode="decimal" min="0.1" max="60" step="0.1" value="10" required><span>分</span></label>
        <button id="fade" class="text-button" type="submit">かけて停止</button>
        <button id="cancel-fade" class="icon-button cancel" type="button" aria-label="フェードを解除してループに戻す" hidden>×</button>
      </form>
      <progress id="progress" max="1" value="0" aria-label="音声を準備中" hidden></progress>
      <p id="error" class="error" role="alert" hidden></p>
    </section>

    <footer>
      <button id="blackout" class="quiet-button">画面を消す</button>
      <button id="install" class="quiet-button" hidden>インストール</button>
      <span id="offline" class="offline" aria-label="オフライン準備状態"></span>
    </footer>
  </main>
  <button id="curtain" aria-label="画面を戻す" hidden></button>
  <dialog id="help">
    <div class="help-heading"><span>夜の音</span><button id="help-close" class="icon-button" aria-label="閉じる">×</button></div>
    <p>通常はループ。時間を選ぶと、その時間全体で音が小さくなり、止まります。</p>
    <p>「フェード中」の表示後に画面をロックしてください。準備中に閉じた場合は、画面に戻るとフェードが始まります。</p>
    <p>通話・省電力設定などで止まる場合があります。端末で一度お試しください。</p>
    <p>iPhoneの音量は本体のボタンで調整してください。</p>
    <p id="install-help">ブラウザのメニューから「ホーム画面に追加」。iPhoneはSafariの共有メニューから。</p>
    <p>音声の保存後はオフラインでも使えます。</p>
    <p class="source"><a href="https://cadmium2525.github.io/Leaf-stream/race" target="_blank" rel="noopener">Leaf-stream</a> の水音をもとに再生成。虫・鳥・風鈴・ゲームの効果音は含みません。</p>
  </dialog>
  <audio id="audio" preload="auto" loop playsinline crossorigin="anonymous" src="./audio/water.wav"></audio>
</body>
</html>
